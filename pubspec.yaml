name: shopzo_pos
description: "FounderCodeMart Pos mobile application"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  go_router: ^17.5.0
  cached_network_image: ^3.4.1
  pdf: ^3.12.0
  connectivity_plus: ^7.3.1
  internet_connection_checker_plus: ^3.1.2
  shimmer: ^3.0.0
  pretty_dio_logger: ^1.4.0
  fl_chart: ^1.2.0
  printing: ^5.14.3
  flutter_widget_from_html_core: ^0.17.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/tree_bg.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/tree_bg.png"
  adaptive_icon_foreground_inset: 28

  remove_alpha_ios: true

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/


